# Builds the session-vault client for every supported platform, attaches the
# binaries to the release created by release-please, and keeps the in-repo
# version strings (plugin.json, session-vault.sh) in sync
# with the released tag.
#
# Trigger: this runs when the release-please workflow COMPLETES, not on
# `push: tags`. release-please creates the tag (and the release) using
# GITHUB_TOKEN, and GitHub does not run workflows at all for push events
# triggered by GITHUB_TOKEN (the only exceptions are workflow_dispatch and
# repository_dispatch). By the time a release-please run finishes
# successfully, the tag exists, so we detect it on the head commit of that
# run. workflow_dispatch (with an explicit tag) is available to backfill
# assets on an already-published release.
name: release-artifacts

on:
  workflow_run:
    workflows: [release-please]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  detect:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            # release-please tags the head commit of the run that cut the release.
            tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          fi
          echo "release tag: ${tag:-<none>}"
          echo "tag=${tag:-}" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
      - name: Build all platforms
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: bash cli/build-release.sh "${TAG#v}"
      - name: Show artifacts
        run: ls -l cli/dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: cli/dist/

  release:
    needs: [detect, build]
    if: needs.detect.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          files: dist/*
          generate_release_notes: false

  # release-please (release-type: simple) bumps version.txt + CHANGELOG but
  # does not know about our plugin manifest or the bootstrap script, so this
  # job keeps those in lockstep with the tag. It pushes straight to main.
  sync-version:
    needs: [detect, build]
    if: needs.detect.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync version strings to ${{ needs.detect.outputs.tag }}
        run: |
          new="${{ needs.detect.outputs.tag }}"
          new="${new#v}"
          # plugin.json is the single source of the version (a marketplace
          # entry version would only shadow it and trip --strict validation).
          plugin="plugins/session-vault/.claude-plugin/plugin.json"
          script="plugins/session-vault/scripts/session-vault.sh"
          sed -i "s/^VERSION=.*$/VERSION=\"$new\"/" "$script"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$new\"/" "$plugin"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$script" "$plugin"
          if git diff --cached --quiet; then
            echo "version strings already at $new"
          else
            git commit -m "chore(release): sync version strings to $new [skip ci]"
            git push origin HEAD:main
          fi
