name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
      - name: Vet
        working-directory: cli
        run: go vet ./...
      - name: Test
        working-directory: cli
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: cli

  bootstrap-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: bash -n plugins/session-vault/scripts/session-vault.sh
      - name: ShellCheck
        run: shellcheck plugins/session-vault/scripts/session-vault.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate plugin JSON
        run: |
          jq empty .claude-plugin/marketplace.json
          jq empty plugins/session-vault/.claude-plugin/plugin.json
